plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.conect.aplicativoconect'
    compileSdk 35

    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        applicationId "com.conect.aplicativoconect"
        minSdk 23
        targetSdk 35
        versionCode 13
        versionName "13.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE',
                    'META-INF/LICENSE.md',
                    'META-INF/LICENSE-notice.md',
                    'META-INF/LICENSE.txt',
                    'META-INF/NOTICE',
                    'META-INF/INDEX.LIST',
                    'META-INF/NOTICE.txt',
                    'META-INF/DEPENDENCIES.txt',
                    'google/**',
            ]
        }
    }
}



configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'io.grpc') {
            // Força o uso de uma versão específica para todas as dependências do gRPC
            details.useVersion '1.48.0'
        }
        // Força versão mais recente do Google Play Billing Library
        if (details.requested.group == 'com.android.billingclient' && details.requested.name == 'billing') {
            details.useVersion '7.0.0'
        }
    }
}

dependencies {
    // Android e Material - versões atualizadas
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Firebase BoM atualizado
    implementation platform('com.google.firebase:firebase-bom:33.6.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.firebase:firebase-storage-ktx'
    implementation 'com.google.firebase:firebase-inappmessaging-display'

    // Play Services
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Navegação atualizada
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.0'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // Networking (manter simples, remover Retrofit se não usado)
    implementation 'com.android.volley:volley:1.2.1'

    // Imagens
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.firebaseui:firebase-ui-storage:8.0.2'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    // Lifecycle atualizado
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.6'

    // Coroutines atualizado
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Gson para JSON parsing
    implementation 'com.google.code.gson:gson:2.10.1'

    // Lottie e outros
    implementation "com.airbnb.android:lottie:6.4.1"

    // Mercado Pago SDK removido - usando apenas Custom Tabs
    // implementation platform('com.mercadopago.android.sdk:sdk-android-bom:0.1.2')
    // implementation 'com.mercadopago.android.sdk:core-methods'
    
    // Para Custom Tabs (conforme documentação oficial)
    implementation 'androidx.browser:browser:1.4.0'

    // Google Play Billing Library - Versão obrigatória mínima 7.0.0
    implementation 'com.android.billingclient:billing:7.0.0'

    // Testes
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

apply plugin: 'com.google.gms.google-services'
